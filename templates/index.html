<!doctype html>
<html>
  <head>
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <!-- Use Flask Static Path Helpers -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="text-center">Voice Assistant APP</h1>
      <p class="text-center">Text-to-Speech & Speech-to-Text Pipeline</p>

      <div class="col-12 col-md-8 mx-auto mb-4">
        <div id="messages-container" class="p-3 border rounded style-chat-window" style="min-height: 350px; max-height: 500px; overflow-y: auto">
          <!-- Messages dynamically appear here -->
        </div>

        <form id="message-form" class="input-group mt-3">
          <input type="text" id="message-input" class="form-control" placeholder="Type your message here..." />
          <div class="input-group-append">
            <button type="submit" id="send-button" class="btn btn-primary">Send</button>
            <button type="button" id="mic-button" class="btn btn-danger">
              <i class="fa fa-microphone"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
